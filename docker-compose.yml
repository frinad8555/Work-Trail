version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careergraph-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: careergraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: careergraph-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: